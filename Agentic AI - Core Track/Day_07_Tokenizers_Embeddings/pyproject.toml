[project]
name = "day-07-tokenizers-embeddings"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.5.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "openai>=3.60.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "sentencepiece>=0.2.3",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "transformers>=5.24.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
